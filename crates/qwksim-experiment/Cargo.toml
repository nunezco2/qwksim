[package]
name = "qwksim-experiment"
description = "Experiment harness for qwksim: hierarchical TOML manifest loader, scenario expansion, replicate orchestration with rayon outer parallelism, Parquet output with embedded provenance metadata, and CRN seeding discipline."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
qwksim-core = { path = "../qwksim-core", version = "0.1.0" }
qwksim-baselines = { path = "../qwksim-baselines", version = "0.1.0" }
qwksim-resources = { path = "../qwksim-resources", version = "0.1.0" }
# T2.11 VQE-on-FCFS smoke needs the workflow / iter / vqe types.
qwksim-workflow = { path = "../qwksim-workflow", version = "0.1.0" }
# M/M/1 validation harness samples exponential inter-arrival and
# service times via the same ChaCha20Rng that gates Q6′ = R2
# deterministic replay.
rand_chacha = "0.9"
rand_core = "0.9"

[dev-dependencies]
# Integration tests read back the smoke run's Parquet output to
# verify schema, record count, and provenance metadata.
arrow = "58"
parquet = "58"
# b5 end-to-end criterion benchmark — moved from qwksim-core in
# T1.13 so it lives alongside the smoke runner it drives.
criterion = "0.5"

[[bench]]
name = "end_to_end"
harness = false

[lints]
workspace = true

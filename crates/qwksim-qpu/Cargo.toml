[package]
name = "qwksim-qpu"
description = "Per-modality QPU models for qwksim: superconducting and trapped-ion in the headline, photonic stub; OU calibration drift, compilation cache, mid-circuit feedback latency, and fidelity-class queue."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[dependencies]
# T3.1 anchor types reuse SimTime from qwksim-core.
qwksim-core = { path = "../qwksim-core", version = "0.1.0" }
# T3.2 QpuAgent implements ResourceAgent from qwksim-resources and
# consumes the bargaining View type from qwksim-scheduler.
qwksim-resources = { path = "../qwksim-resources", version = "0.1.0" }
qwksim-scheduler = { path = "../qwksim-scheduler", version = "0.1.0" }
# Runtime TOML deserialisation of QpuAnchor configs.
serde = { version = "1", features = ["derive"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
# T3.3 OU drift integrator uses the workspace ChaCha20 stream
# (one rng per `Stream::CalibrationDrift` channel).
rand_chacha = "0.9"
rand_core = "0.9"
# T3.8 vendor-calibration adapter parses the JSON sheets the
# build script materialises in $OUT_DIR.
serde_json = "1"

[build-dependencies]
sha2 = "0.10"
toml = { version = "0.8", default-features = false, features = ["parse"] }

[lints]
workspace = true

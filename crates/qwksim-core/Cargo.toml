[package]
name = "qwksim-core"
description = "Discrete-event simulator kernel for qwksim: simulator time, event queue, deterministic RNG hierarchy, and telemetry sink trait."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Gate emission of per-bargaining-round telemetry records (tg3 in
# Q11.6). Off by default (tg2 is the headline); flip on for
# debugging / validation runs.
per-round-telemetry = []

[dependencies]
# Q13.5 = (o3): write Parquet via arrow / parquet; downstream
# qwksim-analysis reads it back via polars.
arrow = "58"
parquet = "58"
# Concrete error enum for the telemetry-sink public surface (the
# only place qwksim-core deviates from Q13.7 = e2 anyhow-everywhere
# at the library boundary).
thiserror = "2"
# Hierarchical RNG (master → replicate → stream) per §3.3; ChaCha20
# is deterministic across platforms and reseedable from a 32-byte
# seed (Q6′ = R2).
rand_chacha = "0.9"
rand_core = "0.9"
# Stable domain-separated hashing used to derive replicate and
# stream seeds. Same algorithm family as the qwksim-qpu build.rs
# vendor-hash gate.
sha2 = "0.10"
# Per-replicate `current_thread` runtime for the (M-A) pure-DES +
# tokio-ergonomics architecture (FLAG-M closed). `rt` is enough —
# no I/O, no timers, no multi-thread runtime. `enable_time` is
# *not* requested: simulator time is the DES logical clock, never
# wall-clock.
tokio = { version = "1", features = ["rt"], default-features = false }

[dev-dependencies]
# Criterion harness for the three b-series benchmarks owned by
# qwksim-core (b1 event-queue, b4 parquet-write, b5 end-to-end).
# Real bodies land alongside the corresponding implementations in
# later phases (T1.x, T6.x); today these are no-op stubs that
# `cargo bench --no-run` must still build.
criterion = "0.5"

[[bench]]
name = "event_queue"
harness = false

[[bench]]
name = "parquet_write"
harness = false

[[bench]]
name = "end_to_end"
harness = false

[lints]
workspace = true

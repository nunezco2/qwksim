[package]
name = "qwksim-workflow"
description = "DAG and workload model for qwksim: task descriptor schema, the six workflow categories (VQE, QAOA, QML, QC-MC/QPE, pure-classical, error-mitigation tomography), and the iterative-loop runtime with cv2 noisy-objective convergence."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Concrete Task / Dag types reuse SimTime from qwksim-core.
qwksim-core = { path = "../qwksim-core", version = "0.1.0" }
# Concrete error enum for the Dag validator's public surface.
thiserror = "2"
# T2.8 iterative-loop runtime samples a noisy convergence
# objective from a per-(workflow, iter) ChaCha20 stream.
rand_chacha = "0.9"
rand_core = "0.9"

[dev-dependencies]
# T2.8 proptest gate: convergence terminates within max_iters
# for any seed.
proptest = "1"

[lints]
workspace = true

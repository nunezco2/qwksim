[package]
name = "qwksim-resources"
description = "HPC, GPU, memory, scratch, and intra-site network resource models for qwksim, including per-resource agent traits, fluid bandwidth pools, and shared-constraint rivalry computation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# ResourceAgent::id / advertised_summary / accept / release all
# speak the core SimTime + AgentId vocabulary.
qwksim-core = { path = "../qwksim-core", version = "0.1.0" }
# ResourceAgent::utility takes the View from the scheduler trait
# (§4.1); per-resource agents are consumers of the dual-view
# abstraction defined in T1.5.
qwksim-scheduler = { path = "../qwksim-scheduler", version = "0.1.0" }

[dev-dependencies]
# T2.3 — proptest gate on the FluidBandwidthPool invariant
# "advertised free capacity ≤ true free capacity within τ_adv".
proptest = "1"

[lints]
workspace = true

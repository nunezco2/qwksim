[package]
name = "qwksim-bargain"
description = "Cooperative Nash-bargaining solver for qwksim: Nash-product evaluator, bounded-round best-response loop, advertisement protocol, utility-function catalogue, and disagreement-point (FCFS-on-stale baseline) evaluator."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# T4.4 BargainingRound keys per-agent state by AgentId; T4.5
# pulls Stream::BargainingTieBreaker via ReplicateRng.
qwksim-core = { path = "../qwksim-core", version = "0.1.0" }
# T4.2 CategoryWeights deserialises from per-category TOML
# sections in the experiment manifest.
serde = { version = "1", features = ["derive"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
# T4.5 tie-break rng is one ChaCha20 stream per round.
rand_chacha = "0.9"
rand_core = "0.9"

[dev-dependencies]
# Criterion harness for the two b-series benchmarks owned by
# qwksim-bargain (b2 bargain-solver Nash-product + best-response,
# b3 advertisement-broadcast aggregation per τ_adv tick). Real
# bodies land in T4.x; today these are no-op stubs.
criterion = "0.5"

[[bench]]
name = "bargain_solver"
harness = false

[[bench]]
name = "advert_aggregation"
harness = false

[lints]
workspace = true

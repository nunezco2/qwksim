# cargo-deny configuration for qwksim.
# Documentation: https://embarkstudios.github.io/cargo-deny/
#
# Policy summary:
#   - Advisories: deny RUSTSEC vulnerabilities; warn on yanked crates.
#   - Bans:       wildcards denied; allow multiple versions while the
#                 workspace is small (revisit once deps grow).
#   - Licenses:   permissive only (Apache-2.0 compatible). Anything not
#                 on the allow-list fails the check.
#   - Sources:    crates.io and explicit git allow-list only.

[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"
ignore = [
    # paste 1.0.15 is unmaintained (announced by dtolnay; RUSTSEC-2024-0436).
    # Reached transitively via `parquet -> paste`. No upstream fix yet — parquet
    # has not switched to `pastey` or an alternative. Reassess when parquet ≥ 59
    # ships; if still present, file an upstream issue.
    "RUSTSEC-2024-0436",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []
skip = []

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "0BSD",
]
confidence-threshold = 0.93
exceptions = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[workspace]
resolver = "2"
members = [
    "crates/qwksim-core",
    "crates/qwksim-resources",
    "crates/qwksim-qpu",
    "crates/qwksim-workflow",
    "crates/qwksim-bargain",
    "crates/qwksim-scheduler",
    "crates/qwksim-baselines",
    "crates/qwksim-experiment",
    "crates/qwksim-analysis",
    "crates/qwksim-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["qwksim contributors"]
license = "Apache-2.0"
repository = "https://github.com/nunezco2/qwksim"

# Workspace-level clippy lints. `disallowed_methods` is the lint
# that enforces the policy spelled out in `clippy.toml`: no
# HashMap iteration on simulator-stateful paths (Q6' = R2). Member
# crates inherit via `[lints] workspace = true`.
[workspace.lints.clippy]
disallowed_methods = "deny"
